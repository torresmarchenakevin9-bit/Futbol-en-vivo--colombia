<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fútbol En Vivo Colombia</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:white;
}

header{
    background:#087443;
    padding:25px 15px;
    text-align:center;
}

h1{
    margin:0;
}

nav{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:15px;
    background:#101a2b;
}

button{
    border:0;
    padding:12px 15px;
    border-radius:20px;
    background:#1d2b43;
    color:white;
    font-weight:bold;
}

main{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:#121d30;
    border:1px solid #263752;
    border-radius:15px;
    padding:16px;
    margin:12px 0;
}

.liga{
    color:#9fb3cc;
    margin-bottom:12px;
}

.equipos{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.equipo{
    width:40%;
    text-align:center;
    font-weight:bold;
}

.marcador{
    font-size:25px;
    font-weight:bold;
    text-align:center;
}

.estado{
    text-align:center;
    color:#65e6ad;
    font-size:13px;
    margin-top:5px;
}

.error{
    color:#ff8080;
}
</style>
</head>

<body>

<header>
<h1>⚽ FÚTBOL EN VIVO COLOMBIA</h1>
<p>Marcadores, resultados y estadísticas en vivo</p>
</header>

<nav>
<button onclick="cargarEnVivo()">🔴 En vivo</button>
<button onclick="cargarHoy()">📅 Hoy</button>
<button onclick="cargarManana()">📅 Mañana</button>
</nav>

<main>

<h2 id="titulo">🔴 Partidos en vivo</h2>

<div id="partidos">
⏳ Cargando partidos...
</div>

</main>

<script>

const API_KEY = "c7f984ec88b247dd76658268c1782bbc";

const API_URL = "https://v3.football.api-sports.io";

async function consultar(url){

const contenedor = document.getElementById("partidos");

contenedor.innerHTML = "⏳ Consultando partidos...";

try{

const controlador = new AbortController();

const tiempo = setTimeout(function(){
    controlador.abort();
},10000);

const respuesta = await fetch(API_URL + url,{
    method:"GET",
    headers:{
        "x-apisports-key":API_KEY
    },
    signal:controlador.signal
});

clearTimeout(tiempo);

if(!respuesta.ok){

contenedor.innerHTML =
'<div class="card error">❌ Error HTTP: '+respuesta.status+'</div>';

return;
}

const datos = await respuesta.json();

if(datos.errors && Object.keys(datos.errors).length > 0){

contenedor.innerHTML =
'<div class="card error">❌ La API respondió con un error. Revisa que tu clave esté activa.</div>';

return;
}

mostrarPartidos(datos.response || []);

}catch(error){

if(error.name === "AbortError"){

contenedor.innerHTML =
'<div class="card error">❌ La API tardó demasiado en responder.</div>';

}else{

contenedor.innerHTML =
'<div class="card error">❌ No se pudo conectar con la API.</div>';

}

}

}

function mostrarPartidos(partidos){

const contenedor = document.getElementById("partidos");

if(partidos.length === 0){

contenedor.innerHTML =
'<div class="card">⚽ No hay partidos disponibles.</div>';

return;

}

contenedor.innerHTML = "";

partidos.forEach(function(partido){

const local = partido.teams.home.name;
const visitante = partido.teams.away.name;

const golesLocal = partido.goals.home ?? "-";
const golesVisitante = partido.goals.away ?? "-";

const liga = partido.league.name;
const estado = partido.fixture.status.long;

contenedor.innerHTML += `

<div class="card">

<div class="liga">
🏆 ${liga}
</div>

<div class="equipos">

<div class="equipo">
${local}
</div>

<div>
<div class="marcador">
${golesLocal} - ${golesVisitante}
</div>

<div class="estado">
${estado}
</div>
</div>

<div class="equipo">
${visitante}
</div>

</div>

</div>

`;

});

}

function cargarEnVivo(){

document.getElementById("titulo").innerText =
"🔴 Partidos en vivo";

consultar("/fixtures?live=all");

}

function cargarHoy(){

document.getElementById("titulo").innerText =
"📅 Partidos de hoy";

const fecha = new Date().toLocaleDateString("en-CA",{
timeZone:"America/Bogota"
});

consultar(
"/fixtures?date="+fecha+"&timezone=America/Bogota"
);

}

function cargarManana(){

document.getElementById("titulo").innerText =
"📅 Partidos de mañana";

ahora.setDate(ahora.getDate()+1);

timeZone:"America/Bogota"
});

consultar(
"/fixtures?date="+fecha+"&timezone=America/Bogota"
);

}

cargarEnVivo();

</script>

</body>
</html>
