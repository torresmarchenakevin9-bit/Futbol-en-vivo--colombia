<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ Fútbol En Vivo Colombia</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:white}
header{background:#087443;padding:25px 15px;text-align:center}
h1{margin:0;font-size:25px}
nav{display:flex;justify-content:center;gap:8px;padding:12px;background:#101a2b}
button{border:0;padding:10px 14px;border-radius:20px;background:#1d2b43;color:white;font-weight:bold}
main{max-width:900px;margin:auto;padding:15px}
.card{background:#121d30;border:1px solid #263752;border-radius:15px;padding:16px;margin:12px 0}
.league{color:#9fb3cc;font-size:13px;margin-bottom:12px}
.teams{display:flex;justify-content:space-between;align-items:center;gap:10px}
.team{width:40%;text-align:center;font-weight:bold}
.score{font-size:25px;font-weight:bold;text-align:center}
.status{color:#65e6ad;font-size:13px;text-align:center;margin-top:5px}
.loading{text-align:center;padding:20px}
.error{color:#ff8080}
</style>
</head>

<body>

<header>
<h1>⚽ FÚTBOL EN VIVO COLOMBIA</h1>
<p>Marcadores, resultados y estadísticas en vivo</p>
</header>

<nav>
<button onclick="cargarEnVivo()">🔴 En vivo</button>
<button onclick="cargarHoy()">📅 Hoy</button>
<button onclick="cargarManana()">📅 Mañana</button>
</nav>

<main>

<h2 id="titulo">🔴 Partidos en vivo</h2>

<div id="partidos" class="loading">
Cargando partidos...
</div>

</main>

<script>

const API_KEY = "c7f984ec88b247dd76658268c1782bbc";

const API_URL = "https://v3.football.api-sports.io";

async function consultar(url){

const contenedor=document.getElementById("partidos");

contenedor.innerHTML="⏳ Cargando partidos...";

try{

const respuesta=await fetch(API_URL+url,{
headers:{
"x-apisports-key":API_KEY
}
});

const datos=await respuesta.json();

if(datos.errors && Object.keys(datos.errors).length){

contenedor.innerHTML=
'<div class="card error">❌ Error de la API. Revisa tu clave.</div>';

return;

}

mostrarPartidos(datos.response || []);

}catch(error){

contenedor.innerHTML=
'<div class="card error">❌ No se pudieron cargar los partidos.</div>';

}

}

function mostrarPartidos(partidos){

const contenedor=document.getElementById("partidos");

if(partidos.length===0){

contenedor.innerHTML=
'<div class="card">⚽ No hay partidos disponibles ahora.</div>';

return;

}

contenedor.innerHTML="";

partidos.forEach(partido=>{

const local=partido.teams.home.name;
  const visitante=partido.teams.away.name;
  const escudoLocal=partido.teams.home.logo;
const escudoVisitante=partido.teams.away.logo;
  
const visitante=partido.teams.away.name;

const golesLocal=partido.goals.home ?? "-";
const golesVisitante=partido.goals.away ?? "-";

const liga=partido.league.name;
const estado=partido.fixture.status.long;

contenedor.innerHTML+=`

<div class="card">

<div class="league">🏆 ${liga}</div>

<div class="teams">

<div class="team">
  <img src="${escudoLocal}" width="45" height="45">
  <br>
  ${local}
</div>

<div>
<div class="score">
${golesLocal} - ${golesVisitante}
</div>

<div class="status">${estado}</div>
</div>

<div class="team">
  <img src="${escudoVisitante}" width="45" height="45">
  <br>
  ${visitante}
</div>

</div>

</div>

`;

});

}

function cargarEnVivo(){

document.getElementById("titulo").innerText="🔴 Partidos en vivo";

consultar("/fixtures?live=all");

}

function cargarHoy(){

document.getElementById("titulo").innerText="📅 Partidos de hoy";

const fecha=new Date().toLocaleDateString("en-CA",{
timeZone:"America/Bogota"
});

consultar("/fixtures?date="+fecha+"&timezone=America/Bogota");

}

function cargarManana(){

document.getElementById("titulo").innerText="📅 Partidos de mañana";

const ahora=new Date();

ahora.setDate(ahora.getDate()+1);

const fecha=ahora.toLocaleDateString("en-CA",{
timeZone:"America/Bogota"
});

consultar("/fixtures?date="+fecha+"&timezone=America/Bogota");

}

cargarEnVivo();

setInterval(cargarEnVivo,60000);

</script>

</body>
</html>
